<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Travel</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-slate-950 text-white font-body p-8">
    <main class="max-w-7xl min-h-dvh bg-white/5 rounded-3xl p-4 mx-auto border border-white/15">
        
        <header class="flex flex-col items-center justify-between gap-4 lg:flex-row">
            <h1 class="font-title text-4xl font-bold leading-tight md:text-5xl">Space Travel</h1>
            <figure class="flex gap-1">
                <img src="./images/astro01.jpg" alt="Astronauta 01"
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro02.jpg" alt="Astronauta 02"cursor-pointer hover:animate-spin duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro03.jpg" alt="Astronauta 03"cursor-pointer hover:animate-spin duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro04.jpg" alt="Astronauta 04"cursor-pointer hover:animate-spin duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro05.jpg" alt="Astronauta 05"cursor-pointer hover:animate-spin duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro06.jpg" alt="Astronauta 06"cursor-pointer hover:animate-spin duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro07.jpg" alt="Astronauta 07"cursor-pointer hover:animate-spin duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro08.jpg" alt="Astronauta 08"cursor-pointer hover:animate-spin duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
            </figure>
        </header>

        <form name="form-viagem" id="form-viagem" method="get" action="">
            <p class="my-5 font-medium text-cyan-300 text-center text-balance lg:text-left">
                Preencha os dados abaixo para confirmar sua viagem espacial.
            </p>

            <fieldset class="border border-white/10 rounded-2xl bg-white/10 p-4 ">
                <legend class="font-title text-lg font-bold text-cyan-300 px-2">01. Dados do viajante</legend>
                <section class="grid gap-6 md:grid-cols-2">
                    <div>
                        <label for="nome" class="block ml-2 text-sm mb-2 text-slate-300">Nome completo</label>
                        <input type="text" name="nome" id="nome" placeholder="Digite seu nome" minlength="10" maxlength="30" required class="border border-white/10 bg-slate-950/60 w-full rounded-lg px-2 py-3 outline-none focus:border-cyan-400 focus:bg-white/10">
                    </div>
                    <div>
                        <label for="codigo" class="block ml-2 text-sm mb-2 text-slate-300">Código de acesso</label>
                        <input type="password" name="codigo" id="codigo" placeholder="Digite seu código" minlength="8" maxlength="20" required
                            class="border border-white/10 bg-slate-950/60 w-full rounded-lg px-2 py-3 outline-none focus:border-cyan-400 focus:bg-white/10">
                    </div>
                    <div>
                        <label for="dataViagem" class="block ml-2 text-sm mb-2 text-slate-300">Data da viagem</label>
                        <input type="date" name="dataViagem" id="dataViagem"
                            required
                            class="border border-white/10 bg-slate-950/60 w-full rounded-lg px-2 py-3 outline-none focus:border-cyan-400 focus:bg-white/10">
                    </div>
                    <div>
                        <label for="email" class="block ml-2 text-sm mb-2 text-slate-300">E-mail</label>
                        <input type="email" name="email" id="email" placeholder="Digite seu e-mail" maxlength="30" required
                            class="border border-white/10 bg-slate-950/60 w-full rounded-lg px-2 py-3 outline-none focus:border-cyan-400 focus:bg-white/10">
                    </div>
                </section>
            </fieldset>

            <!-- segunda seção de dados -->

            <fieldset class="border border-white/10 rounded-2xl bg-white/10 p-4 my-6">
                <legend class="font-title text-lg font-bold text-cyan-300 px-2">02. Detalhes da viagem</legend>
                <section class="grid gap-6 md:grid-cols-2">
                    <div>
                        <label for="destino" class="block ml-2 text-sm mb-2 text-slate-300">Destino</label>
                        <select name="destino" id="destino" required class="border border-white/10 bg-slate-950 w-full rounded-lg px-2 py-3 outline-none focus:border-cyan-400">
                            <option value="" disabled selected>Selecione um destino</option>
                            <option value="Lua">Lua</option>
                            <option value="Marte">Marte</option>
                            <option value="Titan">Titan</option>
                            <option value="Europa">Europa</option>
                        </select>                    
                    </div>

                    <div>
                        <label for="nave" class="block ml-2 text-sm mb-2 text-slate-300">Nave preferida</label>
                        <input type="text" id="nave" name="nave" list="listaNaves" placeholder="Escolha ou digite uma nave" class="border border-white/10 bg-slate-950/60 w-full rounded-lg px-2 py-3 outline-none focus:border-cyan-400 focus:bg-white/10">
                        <datalist id="listaNaves">
                            <option value="Orion GX"></option>
                            <option value="Galaxy Explorer"></option>
                            <option value="Star Voyager"></option>
                            <option value="Cosmos 3000"></option>
                            <option value="Zenith 800"></option>
                            <option value="Open Space"></option>
                        </datalist>
                    </div>
                </section>
                <div>
                    <p class="ml-2 text-sm my-2 text-slate-300">Classe da viagem</p>
                    <section class="grid gap-6 md:grid-cols-3">
                        <label class="flex items-center border border-white/10 gap-3 rounded-lg bg-slate-950/40 p-4 hover:bg-white/10">
                            <input type="radio" name="classeViagem" id="classeViagem" value="economica" class="size-4">
                            <span>Econômica</span>
                        </label>
                        <label class="flex items-center border border-white/10 gap-3 rounded-lg bg-slate-950/40 p-4 hover:bg-white/10">
                            <input type="radio" name="classeViagem" id="classeViagem1" value="economica" class="size-4">
                            <span>Executiva</span>
                        </label>
                        <label class="flex items-center border border-white/10 gap-3 rounded-lg bg-slate-950/40 p-4 hover:bg-white/10">
                            <input type="radio" name="classeViagem" id="classeViagem2" value="economica" class="size-4 accent-amber-400" checked>
                            <span>Luxo</span>
                        </label>
                    </section>
                </div>

                <div>
                    <p class="ml-2 text-sm my-2 text-slate-300">Serviços adicionais</p>
                    <section class="grid gap-6 md:grid-cols-2">
                        <label class="flex items-center border border-white/10 gap-3 rounded-lg bg-slate-950/40 p-4 hover:bg-white/10">
                            <input type="checkbox" name="servicos" id="servico1" value="hotel" class="size-4">
                            <span>Hotel Espacial</span>
                        </label>
                        <label class="flex items-center border border-white/10 gap-3 rounded-lg bg-slate-950/40 p-4 hover:bg-white/10">
                            <input type="checkbox" name="classeViagem" id="servico2" value="passeio lunar" class="size-4">
                            <span>Passeio Lunar</span>
                        </label>
                        <label class="flex items-center border border-white/10 gap-3 rounded-lg bg-slate-950/40 p-4 hover:bg-white/10">
                            <input type="checkbox" name="classeViagem" id="servico3" value="guia espacial" class="size-4" checked>
                            <span>Guia Espacial</span>
                        </label>
                        <label class="flex items-center border border-white/10 gap-3 rounded-lg bg-slate-950/40 p-4 hover:bg-white/10">
                            <input type="checkbox" name="classeViagem" id="servico4" value="seguro" class="size-4"
                                checked>
                            <span>Seguro Interplanetário</span>
                        </label>
                    </section>
                </div>
            </fieldset>
        </form>

    </main>
</body>
</html>
